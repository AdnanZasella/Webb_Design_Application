<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Library</title>
  <meta name="description" content="A personal library of web design references, written to be handed to an AI coding session.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b1612'/%3E%3Cpath d='M16 6l8 10-8 10-8-10z' fill='%23d4623d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1>Design Library</h1>
      <p class="masthead__note">Web design references for client projects. Open one to copy a brief with its pictures.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <label class="search">
        <span class="visually-hidden">Search designs</span>
        <input type="search" id="search" placeholder="Search designs" autocomplete="off">
      </label>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p>No designs match that search.</p>
      <button type="button" class="btn" id="clear">Clear filters</button>
    </div>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <article class="detail">
      <div class="detail__stage">
        <img id="d-image" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
        <iframe id="d-frame" title="Live mock page" hidden loading="lazy"></iframe>
        <p class="detail__caption" id="d-caption"></p>
        <div class="detail__thumbs" id="d-thumbs"></div>
      </div>
      <div class="detail__body">
        <div class="detail__head">
          <h2 id="d-title"></h2>
          <span class="mono" id="d-descriptor"></span>
        </div>
        <p class="detail__summary" id="d-summary"></p>
        <ul class="pills" id="d-tags"></ul>

        <dl class="spec" id="d-spec"></dl>

        <div class="brief">
          <p class="brief__label">Brief for Claude</p>
          <pre id="d-brief" tabindex="0"></pre>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--solid" id="copy-brief">Copy brief</button>
          <button type="button" class="btn btn--solid" id="copy-image">Copy image</button>
          <button type="button" class="btn btn--solid" id="zip">Download zip</button>
          <button type="button" class="btn" id="live" aria-pressed="false" hidden>Live page</button>
          <a class="btn" id="page-link" target="_blank" rel="noopener" hidden>Open in tab</a>
          <button type="button" class="btn" id="fav" aria-pressed="false">Save</button>
          <a class="btn" id="source" target="_blank" rel="noopener" hidden>Open source</a>
          <span class="actions__spacer"></span>
          <button type="button" class="btn" id="prev" aria-label="Previous design">&larr;</button>
          <button type="button" class="btn" id="next" aria-label="Next design">&rarr;</button>
          <button type="button" class="btn" id="close">Close</button>
        </div>
      </div>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/designs.js"></script>
  <script src="app.js"></script>
</body>
</html>
